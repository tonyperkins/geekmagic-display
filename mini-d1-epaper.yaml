substitutions:
  device_name: mini-d1-epaper
  friendly_name: Mini D1 E-Paper Display

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - logger.log: "Requesting sensor updates from Home Assistant"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - logger.log: "Home Assistant API client connected"
  on_client_disconnected:
    then:
      - logger.log: "Home Assistant API client disconnected"

ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "fallback12345"

captive_portal:

# SPI configuration for Waveshare 1.54" e-paper display
# Using hardware SPI pins for D1 Mini ESP32
spi:
  clk_pin: GPIO18  # D5 (SCK)
  mosi_pin: GPIO23  # D7 (MOSI)
  id: epaper_spi

# Fonts for e-paper display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 30
  - file: "gfonts://Orbitron@700"
    id: font_time
    size: 44

# Time component
time:
  - platform: homeassistant
    id: esptime
    timezone: America/Chicago
    on_time_sync:
      then:
        - logger.log: "Time synced from Home Assistant"
        - component.update: epaper_display
    on_time:
      # Update display every minute to keep time current
      - seconds: 0
        then:
          - component.update: epaper_display

# Waveshare 1.54" e-paper display (200x200 pixels)
# 8-pin connector order (left to right): BUSY, RST, DC, CS, CLK, DIN, GND, VCC
display:
  - platform: waveshare_epaper
    spi_id: epaper_spi
    cs_pin: GPIO5     # Try D8/GPIO5 instead
    dc_pin: GPIO17    # Try GPIO17
    busy_pin: GPIO16  # Try GPIO16
    reset_pin: GPIO4  # Keep GPIO4
    model: 1.54in
    update_interval: never  # Manual control to avoid conflicts
    id: epaper_display
    rotation: 0
    lambda: |-
      // Clear display (white background for e-paper)
      it.fill(COLOR_OFF);
      
      auto now = id(esptime).now();
      
      if (now.is_valid()) {
        // Digital time at the top
        it.strftime(100, 0, id(font_time), COLOR_ON, TextAlign::TOP_CENTER, "%H:%M", now);
        
        // Weather Information - scaled for 200x200 display
        int y_start = 70;
        int line_height = 35;
        
        // Temperature row (left/right with icons)
        if (id(outdoor_temperature).has_state() && id(feels_like_temperature).has_state()) {
          int ty = y_start;
          
          // Left: Actual temperature with thermometer icon
          int left_icon_x = 20;
          it.filled_circle(left_icon_x, ty + 5, 3, COLOR_ON);   // bulb
          it.line(left_icon_x, ty - 5, left_icon_x, ty + 3, COLOR_ON); // tube
          it.rectangle(left_icon_x - 2, ty - 8, 4, 10, COLOR_ON);
          it.printf(left_icon_x + 8, ty, id(font_large), COLOR_ON, TextAlign::CENTER_LEFT, "%.1f", id(outdoor_temperature).state);
          
          // Right: Feels like with sun icon
          int right_icon_x = 110;
          int sun_cx = right_icon_x - 3;
          it.circle(sun_cx, ty + 1, 3, COLOR_ON);
          for (int i = 0; i < 8; i++) {
            float a = i * (M_PI/4.0f);
            int x1 = sun_cx + (int)(4 * cos(a));
            int y1 = ty + 1 + (int)(4 * sin(a));
            int x2 = sun_cx + (int)(7 * cos(a));
            int y2 = ty + 1 + (int)(7 * sin(a));
            it.line(x1, y1, x2, y2, COLOR_ON);
          }
          it.printf(right_icon_x + 8, ty, id(font_large), COLOR_ON, TextAlign::CENTER_LEFT, "%.1f", id(feels_like_temperature).state);
        }
        
        // Wind row
        if (id(wind_speed).has_state() && id(wind_gust).has_state() && id(wind_direction).has_state()) {
          int wy = y_start + line_height;
          
          // Wind speed with streamlines icon
          int speed_icon_x = 15;
          it.line(speed_icon_x, wy - 4, speed_icon_x + 8, wy - 4, COLOR_ON);
          it.line(speed_icon_x + 2, wy, speed_icon_x + 10, wy, COLOR_ON);
          it.line(speed_icon_x, wy + 4, speed_icon_x + 8, wy + 4, COLOR_ON);
          it.printf(35, wy, id(font_medium), COLOR_ON, TextAlign::CENTER_LEFT, "%.0f", id(wind_speed).state);
          it.printf(60, wy + 2, id(font_small), COLOR_ON, TextAlign::CENTER_LEFT, "mph");
          
          // Wind gust with flag icon
          int gx = 95;
          it.line(gx, wy - 5, gx, wy + 5, COLOR_ON);
          it.line(gx, wy - 5, gx + 8, wy - 2, COLOR_ON);
          it.line(gx + 8, wy - 2, gx, wy + 1, COLOR_ON);
          it.printf(110, wy, id(font_medium), COLOR_ON, TextAlign::CENTER_LEFT, "%.0f", id(wind_gust).state);
          
          // Wind direction compass
          float dir_from_deg = id(wind_direction).state;
          float from_ang = (dir_from_deg - 90.0f) * M_PI / 180.0f;
          float flow_ang = (dir_from_deg + 90.0f) * M_PI / 180.0f;
          
          int center_x = 175;
          int center_y = wy;
          int compass_r = 10;
          it.circle(center_x, center_y, compass_r, COLOR_ON);
          
          int radius = 10;
          int arrow_base_x = center_x + (int)(radius * cos(from_ang));
          int arrow_base_y = center_y + (int)(radius * sin(from_ang));
          
          int head_len = 7;
          int head_w = 7;
          int tip_x = arrow_base_x + (int)(head_len * cos(flow_ang));
          int tip_y = arrow_base_y + (int)(head_len * sin(flow_ang));
          int lx = arrow_base_x + (int)((head_w/2.0f) * -sin(flow_ang));
          int ly = arrow_base_y + (int)((head_w/2.0f) *  cos(flow_ang));
          int rx = arrow_base_x - (int)((head_w/2.0f) * -sin(flow_ang));
          int ry = arrow_base_y - (int)((head_w/2.0f) *  cos(flow_ang));
          it.filled_triangle(tip_x, tip_y, lx, ly, rx, ry, COLOR_ON);
        }
        
        // Humidity row with bar
        if (id(humidity).has_state()) {
          int bar_height = 8;
          int bar_y = y_start + 2 * line_height - (bar_height/2);
          float percentage = id(humidity).state / 100.0;
          
          // Droplet icon
          int icon_cx = 23;
          int icon_cy = bar_y + bar_height/2;
          it.filled_circle(icon_cx, icon_cy + 2, 5, COLOR_ON);
          it.filled_triangle(icon_cx, icon_cy - 6, icon_cx - 4, icon_cy + 1, icon_cx + 4, icon_cy + 1, COLOR_ON);
          
          // Percentage value
          it.printf(185, y_start + 2 * line_height, id(font_medium), COLOR_ON, TextAlign::CENTER_RIGHT, "%.0f%%", id(humidity).state);
          
          // Bar
          int bar_x = 40;
          int bar_right = 130;
          int bar_width = bar_right - bar_x;
          it.rectangle(bar_x, bar_y, bar_width, bar_height, COLOR_ON);
          it.filled_rectangle(bar_x, bar_y, (int)(bar_width * percentage), bar_height, COLOR_ON);
        }
        
      } else {
        it.printf(100, 100, id(font_medium), COLOR_ON, TextAlign::CENTER, "Waiting for time...");
      }
      
      // Footer with last update time
      it.strftime(100, 195, id(font_small), COLOR_ON, TextAlign::BOTTOM_CENTER, "Updated: %H:%M", now);

# Weather sensors from Home Assistant
sensor:
  - platform: homeassistant
    name: "Outdoor Temperature"
    id: outdoor_temperature
    entity_id: sensor.gw1200b_outdoor_temperature
    accuracy_decimals: 1
    on_value:
      then:
        - logger.log:
            format: "Outdoor temp received: %.1f"
            args: ['x']
        - component.update: epaper_display
    
  - platform: homeassistant
    name: "Feels Like Temperature"
    id: feels_like_temperature
    entity_id: sensor.gw1200b_feels_like_temperature
    accuracy_decimals: 1
    on_value:
      then:
        - logger.log:
            format: "Feels like temp received: %.1f"
            args: ['x']
    
  - platform: homeassistant
    name: "Humidity"
    id: humidity
    entity_id: sensor.gw1200b_humidity
    accuracy_decimals: 0
    on_value:
      then:
        - logger.log:
            format: "Humidity received: %.0f"
            args: ['x']
  
  - platform: homeassistant
    name: "Wind Speed"
    id: wind_speed
    entity_id: sensor.gw1200b_wind_speed
    accuracy_decimals: 0
  
  - platform: homeassistant
    name: "Wind Gust"
    id: wind_gust
    entity_id: sensor.gw1200b_wind_gust
    accuracy_decimals: 0
  
  - platform: homeassistant
    name: "Wind Direction"
    id: wind_direction
    entity_id: sensor.gw1200b_wind_direction
    accuracy_decimals: 0

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

# Button to manually refresh display
button:
  - platform: template
    name: "${friendly_name} Refresh Display"
    on_press:
      - component.update: epaper_display
