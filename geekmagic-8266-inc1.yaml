substitutions:
  device_name: geekmagic-esp8266
  friendly_sensor_name: geekmagic_display_07c9f4

esphome:
  name:  ${device_name}
  friendly_name: GeekMagic ESP8266 Inc1

esp8266:
  board: esp12e
  framework:
    version: recommended

external_components:
  - source:
      type: git
      url: https://github.com/rletendu/esphome.git
      ref: st7789_nobuffer_202312
    components: [st7789v]

ota:
  - platform: esphome
    password: ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Geekmagic-Inc1"
    password: "test12345"

api:
  encryption:
    key: !secret api_key

logger:

captive_portal:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 10 Hz
    id: pwm_output

light:
  - platform: monochromatic
    output: pwm_output
    name: "Backlight"

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
  - file: "gfonts://Roboto"
    id: font_medium
    size: 28
  - file: "gfonts://Orbitron@700"
    id: font_time
    size: 60

time:
  - platform: homeassistant
    id: esptime
    timezone: America/Chicago

# INCREMENT 1: Add basic weather sensors
sensor:
  # Keep your existing sensors
  - platform: homeassistant
    entity_id: sensor.moc_l1_l2_l3
    id: Mocl13
    internal: true
    accuracy_decimals: 1
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
 
  - platform: homeassistant
    entity_id: sensor.sonoffbasic_ds_multi_out
    id: tempzew
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - platform: homeassistant
    entity_id: sensor.temp_dom
    id: poktv
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - platform: homeassistant
    entity_id: sensor.temperature_max
    id: maxout
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  # NEW: Weather sensors from geekmagic-clock
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.gw1200b_outdoor_temperature
    accuracy_decimals: 1
    
  - platform: homeassistant
    id: feels_like_temperature
    entity_id: sensor.gw1200b_feels_like_temperature
    accuracy_decimals: 1
    
  - platform: homeassistant
    id: humidity
    entity_id: sensor.gw1200b_humidity
    accuracy_decimals: 0

text_sensor:    
  - platform: homeassistant
    name: "Energy 0/1"
    entity_id: input_select.energy_0_1
    id: energy

color:
  - id: color_w
    red: 90%
    green: 90%
    blue: 90%
  - id: color_green
    red: 10%
    green: 60%
    blue: 40%
  - id: color_blue
    red: 10%
    green: 40%
    blue: 60%
  - id: color_blue2
    red: 70%
    green: 70%
    blue: 100%

display:
  - platform: st7789v
    model: "Custom"
    spi_id: spihwd
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    dc_pin: GPIO00
    reset_pin: GPIO02
    eightbitcolor: True
    update_interval: 5s
    id: disp
    spi_mode: mode3
    lambda: |-
      int center_x = it.get_width() / 2;
      int center_y = it.get_height() / 2;
      
      // Top: Time display
      it.strftime(center_x, 10, id(font_time), id(color_blue2), TextAlign::TOP_CENTER, "%H:%M", id(esptime).now());
      
      // Middle: Your existing data (smaller now)
      it.printf(10, 80, id(font_small), id(color_w), TextAlign::LEFT, "Power: %.1fW", id(Mocl13).state);
      it.printf(10, 100, id(font_small), id(color_green), TextAlign::LEFT, "%s", id(energy).state.c_str());
      it.printf(10, 120, id(font_small), id(color_w), TextAlign::LEFT, "Indoor: %.1f°C", id(tempzew).state);
      
      // NEW: Weather data at bottom
      if (id(outdoor_temperature).has_state()) {
        it.printf(10, 160, id(font_medium), id(color_w), TextAlign::LEFT, "Out: %.1f°", id(outdoor_temperature).state);
      }
      
      if (id(feels_like_temperature).has_state()) {
        it.printf(10, 185, id(font_small), id(color_w), TextAlign::LEFT, "Feels: %.1f°", id(feels_like_temperature).state);
      }
      
      if (id(humidity).has_state()) {
        it.printf(10, 210, id(font_small), id(color_blue), TextAlign::LEFT, "Humidity: %.0f%%", id(humidity).state);
      }
