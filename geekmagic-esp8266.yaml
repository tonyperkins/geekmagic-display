# Configuration parameters
substitutions:
  # Set to 'true' to enable automated presence detection and brightness control
  # Set to 'false' to disable automation (display always on, manual brightness only)
  enable_automation: 'true'
  device_name: geekmagic-esp8266
  friendly_name: GeekMagic ESP8266
  friendly_sensor_name: geekmagic_display_07c9f4

esphome:
  name:  ${device_name}
  friendly_name: GeekMagic ESP8266
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: back_light
          brightness: 40%

esp8266:
  board: esp12e
  framework:
    version: recommended
  
external_components:
  - source:
      type: git
      url: https://github.com/rletendu/esphome.git
      ref: st7789_nobuffer_202312
    # refresh: 0s
    components: [st7789v]

ota:
  - platform: esphome
    password: ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Geekmagic-Esp8266"
    password: ap_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key


# Enable logging
logger:

captive_portal:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 1000 Hz
    id: pwm_output
    inverted: true

light:
  - platform: monochromatic
    id: back_light
    output: pwm_output
    name: "Backlight"
    gamma_correct: 2.0
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

number:
  - platform: template
    name: "Display Brightness"
    icon: "mdi:brightness-6"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 40
    optimistic: true
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - light.turn_on:
          id: back_light
          brightness: !lambda 'return x / 100.0;'

# Display configuration for your actual display
display:
  - platform: st7789v
    id: lcd_display
    model: "Custom"
    spi_id: spihwd
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    # dc_pin: GPIO02
    # reset_pin: GPIO04
    dc_pin: GPIO00
    reset_pin: GPIO02
    #backlight_pin: GPIO25
    eightbitcolor: True
    update_interval: 30s
    spi_mode: mode3
    lambda: |-
      auto now = id(homeassistant_time).now();

      if (now.is_valid()) {
        // Digital time at the top
        it.strftime(120, 0, id(time_font), Color(120,235,120), TextAlign::TOP_CENTER, "%H:%M", now);

        // Weather Information
        int y_start = 100;
        int line_height = 40;

        // Temperature (left/right aligned with icons)
        if (id(outdoor_temperature).has_state() && id(feels_like_temperature).has_state()) {
          int ty = y_start;
          // color thresholds helper lambdas
          auto color_for_temp = [](float t) -> Color {
            if (t > 100) return Color(255, 50, 50);   // very red
            if (t > 90)  return Color(255, 90, 90);   // mostly red
            if (t > 85)  return Color(255, 140, 140); // more red
            if (t > 80)  return Color(255, 190, 190); // slight red
            return Color::WHITE;
          };
          Color temp_color_left  = color_for_temp(id(outdoor_temperature).state);
          Color temp_color_right = color_for_temp(id(feels_like_temperature).state);

          // Left: Actual temperature, thermometer icon
          int left_icon_x = 24;   // left margin for icon
          it.filled_circle(left_icon_x, ty + 6, 4, Color::WHITE);   // bulb
          it.line(left_icon_x, ty - 6, left_icon_x, ty + 4, Color::WHITE); // tube
          it.rectangle(left_icon_x - 2, ty - 10, 4, 12, Color::WHITE);
          // Font sizes available: tiny, small, medium, large, giant
          it.printf(left_icon_x + 10, ty, id(medium_font), temp_color_left, TextAlign::CENTER_LEFT, "%.1f°", id(outdoor_temperature).state);

          // Right: Feels like, sun with rays (icon centered with number)
          int right_icon_x = 135;                      // right margin for icon
          int sun_cx = right_icon_x - 4;              // icon centered with value
          it.circle(sun_cx, ty + 1, 4, Color::WHITE);  // align icon vertically with text
          for (int i = 0; i < 8; i++) {
            float a = i * (M_PI/4.0f);
            int x1 = sun_cx + (int)(5 * cos(a));       // slightly shorter rays
            int y1 = ty + (int)(5 * sin(a));
            int x2 = sun_cx + (int)(8 * cos(a));
            int y2 = ty + (int)(8 * sin(a));
            it.line(x1, y1, x2, y2, Color::WHITE);
          }
          it.printf(right_icon_x + 10, ty, id(medium_font), temp_color_right, TextAlign::CENTER_LEFT, "%.1f°", id(feels_like_temperature).state);
        }

        // Wind
        if (id(wind_speed).has_state() && id(wind_gust).has_state() && id(wind_direction).has_state()) {
          // Display wind speed and gust with icons (no separator)
          int wy = y_start + line_height;
          // speed icon: streamlines
          int speed_icon_x = 20;
          it.line(speed_icon_x,     wy - 5, speed_icon_x + 10, wy - 5, Color::WHITE);
          it.line(speed_icon_x + 2, wy,     speed_icon_x + 12, wy,     Color::WHITE);
          it.line(speed_icon_x,     wy + 5, speed_icon_x + 10, wy + 5, Color::WHITE);
          // columns for values and units (fixed x to avoid overlap with variable digit widths)
          int speed_val_x = 43;   // value start near icon
          char spd_buf[8];
          snprintf(spd_buf, sizeof(spd_buf), "%.0f", id(wind_speed).state);
          it.printf(speed_val_x, wy, id(medium_font), Color::WHITE, TextAlign::CENTER_LEFT, "%s", spd_buf);
          int spd_len = (int)strlen(spd_buf);
          int speed_mph_x = speed_val_x + spd_len * 14 + 2; // ~14px per digit for medium font
          it.printf(speed_mph_x, wy+2, id(tiny_font), Color::WHITE, TextAlign::CENTER_LEFT, "mph");

          // gust icon: small flag
          int gx = 118;           // gust icon start
          it.line(gx, wy - 6, gx, wy + 6, Color::WHITE); // pole
          it.line(gx, wy - 6, gx + 10, wy - 2, Color::WHITE);
          it.line(gx + 10, wy - 2, gx, wy + 2, Color::WHITE);
          it.line(gx, wy + 2, gx, wy - 6, Color::WHITE);
          int gust_val_x = 135;   // value start near flag icon
          char gst_buf[8];
          snprintf(gst_buf, sizeof(gst_buf), "%.0f", id(wind_gust).state);
          it.printf(gust_val_x, wy, id(medium_font), Color::WHITE, TextAlign::CENTER_LEFT, "%s", gst_buf);
          int gst_len = (int)strlen(gst_buf);
          int gust_mph_x = gust_val_x + gst_len * 14 + 2; // ~14px per digit
          it.printf(gust_mph_x, wy+2, id(tiny_font), Color::WHITE, TextAlign::CENTER_LEFT, "mph");

          // Draw wind direction arrowhead (sensor reports FROM direction)
          // Place arrowhead at compass position where wind is coming FROM
          // Point the arrow in the direction the wind is flowing TO
          float dir_from_deg = id(wind_direction).state;
          float from_ang = (dir_from_deg - 90.0f) * M_PI / 180.0f;  // FROM direction in screen coordinates
          float flow_ang = (dir_from_deg + 90.0f) * M_PI / 180.0f;  // TO direction (180° opposite)

          int center_x = 206;
          int center_y = y_start + line_height;
          // Draw surrounding circle like a compass
          int compass_r = 13;
          it.circle(center_x, center_y, compass_r, Color::WHITE);

          // Position arrowhead at the compass edge where wind is FROM
          int radius = 13;
          int arrow_base_x = center_x + (int)(radius * cos(from_ang));
          int arrow_base_y = center_y + (int)(radius * sin(from_ang));
          
          // Draw triangular arrowhead pointing toward flow direction
          int head_len = 9;
          int head_w = 9;
          // Tip points inward toward center (flow direction)
          int tip_x = arrow_base_x + (int)(head_len * cos(flow_ang));
          int tip_y = arrow_base_y + (int)(head_len * sin(flow_ang));
          // Base corners perpendicular to flow direction
          int lx = arrow_base_x + (int)((head_w/2.0f) * -sin(flow_ang));
          int ly = arrow_base_y + (int)((head_w/2.0f) *  cos(flow_ang));
          int rx = arrow_base_x - (int)((head_w/2.0f) * -sin(flow_ang));
          int ry = arrow_base_y - (int)((head_w/2.0f) *  cos(flow_ang));
          it.filled_triangle(tip_x, tip_y, lx, ly, rx, ry, Color::WHITE);
        }

        // Humidity
        if (id(humidity).has_state()) {
          // Full-width humidity row: icon (left), wide bar (middle), percent (right)
          int bar_height = 10;
          int bar_y = y_start + 2 * line_height - (bar_height/2);
          float percentage = id(humidity).state / 100.0;
          Color hum_color = Color(120, 180, 255);
          // icon
          int icon_cx = 28;
          int icon_cy = bar_y + bar_height/2;
          it.filled_circle(icon_cx, icon_cy + 2, 6, Color::WHITE);
          it.filled_triangle(icon_cx, icon_cy - 8, icon_cx - 5, icon_cy + 1, icon_cx + 5, icon_cy + 1, Color::WHITE);
          // percent value at far right
          int pct_x = 224; // right margin anchor
          it.printf(pct_x, y_start + 2 * line_height, id(medium_font), hum_color, TextAlign::CENTER_RIGHT, "%.0f%%", id(humidity).state);
          // bar spans from left of center to just before percent
          int bar_x = 48;
          int bar_right = 160;
          int bar_width = bar_right - bar_x;
          it.rectangle(bar_x, bar_y, bar_width, bar_height, Color::WHITE);
          it.filled_rectangle(bar_x, bar_y, (int)(bar_width * percentage), bar_height, hum_color);
        }

      } else {
        it.printf(120, 120, id(roboto_font), Color::WHITE, TextAlign::CENTER, "Waiting for time...");
      }

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_font
    size: 18
  - file: "gfonts://Roboto"
    id: small_font
    size: 14
  - file: "gfonts://Roboto"
    id: tiny_font
    size: 11
  - file: "gfonts://Roboto"
    id: medium_font
    size: 30
  - file: "gfonts://Orbitron@700"
    id: time_font
    size: 64

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/Chicago
    on_time_sync:
      then:
        - component.update: lcd_display

# Text sensor to receive messages from Home Assistant
text_sensor:
  - platform: homeassistant
    name: "Display Message"
    id: display_message
    entity_id: input_text.geekmagic_display_message
  
sensor:
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.gw1200b_outdoor_temperature
  - platform: homeassistant
    id: feels_like_temperature
    entity_id: sensor.gw1200b_feels_like_temperature
  - platform: homeassistant
    id: wind_speed
    entity_id: sensor.gw1200b_wind_speed
  - platform: homeassistant
    id: wind_gust
    entity_id: sensor.gw1200b_wind_gust
  - platform: homeassistant
    id: humidity
    entity_id: sensor.gw1200b_humidity
  - platform: homeassistant
    id: wind_direction
    entity_id: sensor.gw1200b_wind_direction
