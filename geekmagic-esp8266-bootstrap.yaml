substitutions:
  device_name: geekmagic-esp8266

esphome:
  name: ${device_name}
  friendly_name: GeekMagic Bootstrap

esp8266:
  board: esp12e
  framework:
    version: recommended

ota:
  - platform: esphome
    password: ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

logger:
  level: NONE

# Minimal display - just shows "Ready for OTA"
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 1000 Hz
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 24

display:
  - platform: st7789v
    model: "Custom"
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    dc_pin: GPIO00
    reset_pin: GPIO02
    eightbitcolor: True
    update_interval: 60s
    spi_mode: mode3
    lambda: |-
      it.printf(120, 120, id(font1), Color(0,255,0), TextAlign::CENTER, "Ready for OTA");
