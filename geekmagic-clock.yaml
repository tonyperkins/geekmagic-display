# Configuration parameters
substitutions:
  # Set to 'true' to enable automated presence detection and brightness control
  # Set to 'false' to disable automation (display always on, manual brightness only)
  enable_automation: 'true'

esphome:
  name: geekmagic-clock
  friendly_name: GeekMagic Clock
  on_boot:
    then:
      - delay: 2s  # Give time for Home Assistant connection
      - if:
          condition:
            lambda: 'return std::string("${enable_automation}") == "true" && id(office_occupancy).state;'
          then:
            # Only turn on display if office is occupied with appropriate brightness
            - light.turn_on:
                id: back_light
                brightness: !lambda |-
                  if (id(brightness_mode) == 0) {
                    // Auto mode - use illuminance
                    if (id(office_illuminance).has_state()) {
                      float lux = id(office_illuminance).state;
                      if (lux < 200) return 0.15f;        // 15% for < 200 lx
                      else if (lux < 400) return 0.20f;   // 20% for 200-400 lx
                      else if (lux < 600) return 0.30f;   // 30% for 400-600 lx
                      else return 0.40f;                  // 40% for > 600 lx
                    } else {
                      return 0.20f;  // Default if no illuminance data
                    }
                  } else {
                    // Manual mode
                    switch (id(brightness_mode)) {
                      case 1: return 0.15f;  // 15%
                      case 2: return 0.25f;  // 25%
                      case 3: return 0.50f;  // 50%
                      case 4: return 1.0f;   // 100%
                      default: return 0.20f;
                    }
                  }
            - component.update: lcd_display
          else:
            # Automation disabled - turn on display at default brightness
            - if:
                condition:
                  lambda: 'return std::string("${enable_automation}") == "false";'
                then:
                  - light.turn_on:
                      id: back_light
                      brightness: 0.25
                  - component.update: lcd_display

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging Test
logger:

# Enable Home Assistant API
