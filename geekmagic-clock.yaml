    password: "uewvtkFigvsI"

captive_portal:

# Backlight control
output:
  - platform: ledc
    pin: GPIO25
    inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Persistent brightness level index (0..3)
globals:
  - id: bright_idx
    type: int
    restore_value: yes
    initial_value: '1'
  # Scrolling forecast marquee state
  - id: forecast_msg
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: forecast_scroll_x
    type: int
    restore_value: no
    initial_value: '240'
  - id: forecast_px_len
    type: int
    restore_value: no
    initial_value: '0'
  # Manual brightness override mode (0 = auto, 1-4 = manual levels)
  - id: brightness_mode
    type: int
    restore_value: yes
    initial_value: '0'

# Touch sensor setup
esp32_touch:

binary_sensor:
  # Office occupancy sensor from Home Assistant
  - platform: homeassistant
    name: "Office Occupancy"
    id: office_occupancy
    entity_id: binary_sensor.everything_presence_one_278be8_occupancy
    on_state:
      then:
        # Only respond to occupancy changes if automation is enabled
        - if:
            condition:
              lambda: 'return std::string("${enable_automation}") == "true";'
            then:
              - if:
                  condition:
                    binary_sensor.is_on: office_occupancy
                  then:
                    # Turn on display when occupancy detected with appropriate brightness
                    - light.turn_on:
                        id: back_light
                        brightness: !lambda |-
                          if (id(brightness_mode) == 0) {
                            // Auto mode - use illuminance
                            if (id(office_illuminance).has_state()) {
                              float lux = id(office_illuminance).state;
                              if (lux < 200) return 0.15f;        // 15% for < 200 lx
                              else if (lux < 400) return 0.20f;   // 20% for 200-400 lx
                              else if (lux < 600) return 0.30f;   // 30% for 400-600 lx
                              else return 0.40f;                  // 40% for > 600 lx
                            } else {
                              return 0.20f;  // Default if no illuminance data
                            }
                          } else {
                            // Manual mode
                            switch (id(brightness_mode)) {
                              case 1: return 0.15f;  // 15%
                              case 2: return 0.25f;  // 25%
                              case 3: return 0.50f;  // 50%
                              case 4: return 1.0f;   // 100%
                              default: return 0.20f;
                            }
                          }
                    - component.update: lcd_display
                  else:
                    # Turn off display when occupancy clear
                    - light.turn_off: back_light

  - platform: esp32_touch
    name: "Touch Button"
    id: touch_btn
    pin: GPIO32
    threshold: 1250
    on_multi_click:
    # Long click toggles the backlight (only if occupancy detected when automation enabled)
    - timing:
        - ON for at least 500ms
      then:
        - if:
            condition:
              lambda: |-
                if (std::string("${enable_automation}") == "true") {
                  return id(office_occupancy).state;
                } else {
                  return true;  // Always allow toggle when automation disabled
                }
            then:
              - light.toggle: back_light

    # Short click cycles brightness (only if light is on, and occupancy detected if automation enabled)
    - timing:
        - ON for at most 499ms
      then:
        - if:
            condition:
              lambda: |-
                if (std::string("${enable_automation}") == "true") {
                  return id(office_occupancy).state && id(back_light).current_values.is_on();
                } else {
                  return id(back_light).current_values.is_on();
                }
            then:
              - lambda: |-
                  // Cycle brightness mode: 0=auto, 1-4=manual levels
                  id(brightness_mode) = (id(brightness_mode) + 1) % 5;
                  float b = 0.20f;  // default
                  
                  if (id(brightness_mode) == 0) {
                    // Auto mode - use illuminance
                    if (id(office_illuminance).has_state()) {
                      float lux = id(office_illuminance).state;
                      if (lux < 200) b = 0.15f;        // 15% for < 200 lx
                      else if (lux < 400) b = 0.20f;   // 20% for 200-400 lx
                      else if (lux < 600) b = 0.30f;   // 30% for 400-600 lx
                      else b = 0.40f;                  // 40% for > 600 lx
                    }
                  } else {
                    // Manual mode
                    switch (id(brightness_mode)) {
                      case 1: b = 0.15f; break;  // 15%
                      case 2: b = 0.25f; break;  // 25%
                      case 3: b = 0.50f; break;  // 50%
                      case 4: b = 1.0f; break;   // 100%
                    }
                  }
                  
                  auto call = id(back_light).turn_on();
                  call.set_brightness(b);
                  call.perform();

# SPI configuration for your actual hardware
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23  # Your hardware uses GPIO23, not GPIO19
  id: spihwd

# Display configuration for your actual display
display:
  - platform: ili9xxx
    model: st7789v
    spi_id: spihwd
    data_rate: 40MHz
    dc_pin: GPIO02
    reset_pin: GPIO04
    spi_mode: MODE3
    dimensions:
      width: 240      # Display is 240x240
      height: 240
      offset_height: 0
      offset_width: 0
    invert_colors: true
    color_order: bgr
    color_palette: 8BIT
    auto_clear_enabled: true
    update_interval: 100ms
    id: lcd_display
    lambda: |-
      it.fill(Color::BLACK);
      auto now = id(homeassistant_time).now();

      if (now.is_valid()) {
        // Digital time at the top
        it.strftime(120, 0, id(time_font), Color(120,235,120), TextAlign::TOP_CENTER, "%H:%M", now);

        // Weather Information
        int y_start = 100;
        int line_height = 40;

        // Temperature (left/right aligned with icons)
        if (id(outdoor_temperature).has_state() && id(feels_like_temperature).has_state()) {
          int ty = y_start;
          // color thresholds helper lambdas
          auto color_for_temp = [](float t) -> Color {
            if (t > 100) return Color(255, 50, 50);   // very red
            if (t > 90)  return Color(255, 90, 90);   // mostly red
            if (t > 85)  return Color(255, 140, 140); // more red
            if (t > 80)  return Color(255, 190, 190); // slight red
            return Color::WHITE;
          };
          Color temp_color_left  = color_for_temp(id(outdoor_temperature).state);
          Color temp_color_right = color_for_temp(id(feels_like_temperature).state);

          // Left: Actual temperature, thermometer icon
          int left_icon_x = 24;   // left margin for icon
          it.filled_circle(left_icon_x, ty + 6, 4, Color::WHITE);   // bulb
          it.line(left_icon_x, ty - 6, left_icon_x, ty + 4, Color::WHITE); // tube
          it.rectangle(left_icon_x - 2, ty - 10, 4, 12, Color::WHITE);
          // Font sizes available: tiny, small, medium, large, giant
          it.printf(left_icon_x + 10, ty, id(medium_font), temp_color_left, TextAlign::CENTER_LEFT, "%.1f°", id(outdoor_temperature).state);

          // Right: Feels like, sun with rays (icon centered with number)
          int right_icon_x = 135;                      // right margin for icon
          int sun_cx = right_icon_x - 4;              // icon centered with value
          it.circle(sun_cx, ty + 1, 4, Color::WHITE);  // align icon vertically with text
          for (int i = 0; i < 8; i++) {
            float a = i * (M_PI/4.0f);
            int x1 = sun_cx + (int)(5 * cos(a));       // slightly shorter rays
            int y1 = ty + (int)(5 * sin(a));
            int x2 = sun_cx + (int)(8 * cos(a));
            int y2 = ty + (int)(8 * sin(a));
            it.line(x1, y1, x2, y2, Color::WHITE);
          }
          it.printf(right_icon_x + 10, ty, id(medium_font), temp_color_right, TextAlign::CENTER_LEFT, "%.1f°", id(feels_like_temperature).state);
        }

        // Wind
        if (id(wind_speed).has_state() && id(wind_gust).has_state() && id(wind_direction).has_state()) {
          // Display wind speed and gust with icons (no separator)
          int wy = y_start + line_height;
          // speed icon: streamlines
          int speed_icon_x = 20;
          it.line(speed_icon_x,     wy - 5, speed_icon_x + 10, wy - 5, Color::WHITE);
          it.line(speed_icon_x + 2, wy,     speed_icon_x + 12, wy,     Color::WHITE);
          it.line(speed_icon_x,     wy + 5, speed_icon_x + 10, wy + 5, Color::WHITE);
          // columns for values and units (fixed x to avoid overlap with variable digit widths)
          int speed_val_x = 43;   // value start near icon
          char spd_buf[8];
          snprintf(spd_buf, sizeof(spd_buf), "%.0f", id(wind_speed).state);
          it.printf(speed_val_x, wy, id(medium_font), Color::WHITE, TextAlign::CENTER_LEFT, "%s", spd_buf);
          int spd_len = (int)strlen(spd_buf);
          int speed_mph_x = speed_val_x + spd_len * 14 + 2; // ~14px per digit for medium font
          it.printf(speed_mph_x, wy+2, id(tiny_font), Color::WHITE, TextAlign::CENTER_LEFT, "mph");

          // gust icon: small flag
          int gx = 118;           // gust icon start
          it.line(gx, wy - 6, gx, wy + 6, Color::WHITE); // pole
          it.line(gx, wy - 6, gx + 10, wy - 2, Color::WHITE);
          it.line(gx + 10, wy - 2, gx, wy + 2, Color::WHITE);
          it.line(gx, wy + 2, gx, wy - 6, Color::WHITE);
          int gust_val_x = 135;   // value start near flag icon
          char gst_buf[8];
          snprintf(gst_buf, sizeof(gst_buf), "%.0f", id(wind_gust).state);
          it.printf(gust_val_x, wy, id(medium_font), Color::WHITE, TextAlign::CENTER_LEFT, "%s", gst_buf);
          int gst_len = (int)strlen(gst_buf);
          int gust_mph_x = gust_val_x + gst_len * 14 + 2; // ~14px per digit
          it.printf(gust_mph_x, wy+2, id(tiny_font), Color::WHITE, TextAlign::CENTER_LEFT, "mph");

          // Draw wind direction arrowhead (sensor reports FROM direction)
          // Place arrowhead at compass position where wind is coming FROM
          // Point the arrow in the direction the wind is flowing TO
          float dir_from_deg = id(wind_direction).state;
          float from_ang = (dir_from_deg - 90.0f) * M_PI / 180.0f;  // FROM direction in screen coordinates
          float flow_ang = (dir_from_deg + 90.0f) * M_PI / 180.0f;  // TO direction (180° opposite)

          int center_x = 206;
          int center_y = y_start + line_height;
          // Draw surrounding circle like a compass
          int compass_r = 13;
          it.circle(center_x, center_y, compass_r, Color::WHITE);

          // Position arrowhead at the compass edge where wind is FROM
          int radius = 13;
          int arrow_base_x = center_x + (int)(radius * cos(from_ang));
          int arrow_base_y = center_y + (int)(radius * sin(from_ang));
          
          // Draw triangular arrowhead pointing toward flow direction
          int head_len = 9;
          int head_w = 9;
          // Tip points inward toward center (flow direction)
          int tip_x = arrow_base_x + (int)(head_len * cos(flow_ang));
          int tip_y = arrow_base_y + (int)(head_len * sin(flow_ang));
          // Base corners perpendicular to flow direction
          int lx = arrow_base_x + (int)((head_w/2.0f) * -sin(flow_ang));
          int ly = arrow_base_y + (int)((head_w/2.0f) *  cos(flow_ang));
          int rx = arrow_base_x - (int)((head_w/2.0f) * -sin(flow_ang));
          int ry = arrow_base_y - (int)((head_w/2.0f) *  cos(flow_ang));
          it.filled_triangle(tip_x, tip_y, lx, ly, rx, ry, Color::WHITE);
        }

        // Humidity
        if (id(humidity).has_state()) {
          // Full-width humidity row: icon (left), wide bar (middle), percent (right)
          int bar_height = 10;
          int bar_y = y_start + 2 * line_height - (bar_height/2);
          float percentage = id(humidity).state / 100.0;
          auto color_for_hum = [](float h) -> Color {
            if (h > 80) return Color(80, 160, 255);   // very blue
            if (h > 65) return Color(120, 180, 255);  // more blue
            if (h > 50) return Color(160, 200, 255);  // slight blue
            return Color::WHITE;
          };
          Color hum_color = color_for_hum(id(humidity).state);
          // icon
          int icon_cx = 28;
          int icon_cy = bar_y + bar_height/2;
          it.filled_circle(icon_cx, icon_cy + 2, 6, Color::WHITE);
          it.filled_triangle(icon_cx, icon_cy - 8, icon_cx - 5, icon_cy + 1, icon_cx + 5, icon_cy + 1, Color::WHITE);
          // percent value at far right
          int pct_x = 224; // right margin anchor
          it.printf(pct_x, y_start + 2 * line_height, id(medium_font), hum_color, TextAlign::CENTER_RIGHT, "%.0f%%", id(humidity).state);
          // bar spans from left of center to just before percent
          int bar_x = 48;
          int bar_right = 160;
          int bar_width = bar_right - bar_x;
          it.rectangle(bar_x, bar_y, bar_width, bar_height, Color::WHITE);
          it.filled_rectangle(bar_x, bar_y, (int)(bar_width * percentage), bar_height, hum_color);
        }

      } else {
        it.printf(120, 120, id(roboto_font), Color::WHITE, TextAlign::CENTER, "Waiting for time...");
      }

      // Scrolling forecast marquee at the bottom
      {
        // If no forecast yet, show nothing
        if (id(forecast_msg).size() > 0) {
          int y = 214; // baseline near bottom
          // draw shadow for readability
          it.printf(id(forecast_scroll_x)+1, y+1, id(medium_font), Color(0,0,0), TextAlign::CENTER_LEFT, "%s", id(forecast_msg).c_str());
          it.printf(id(forecast_scroll_x),   y,   id(medium_font), Color(200,140,50), TextAlign::CENTER_LEFT, "%s", id(forecast_msg).c_str());
        }
        // Advance scroll position every frame
        id(forecast_scroll_x) -= 4;
        if (id(forecast_scroll_x) < -id(forecast_px_len)) {
          id(forecast_scroll_x) = 240; // reset to right edge
        }
      }

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_font
    size: 18
  - file: "gfonts://Roboto"
    id: small_font
    size: 14
  - file: "gfonts://Roboto"
    id: tiny_font
    size: 11
  - file: "gfonts://Roboto"
    id: medium_font
    size: 30
  - file: "gfonts://Orbitron@700"
    id: time_font
    size: 64

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/Chicago
    on_time_sync:
      then:
        - component.update: lcd_display
    on_time:
      - seconds: /1
        then:
          - component.update: lcd_display
      - at:
          hour: 22
          minute: 30
          second: 0
        then:
          # Only turn off at night if automation enabled and office is not occupied
          - if:
              condition:
                lambda: 'return std::string("${enable_automation}") == "true" && !id(office_occupancy).state;'
              then:
                - light.turn_off: back_light

# Text sensor to receive messages from Home Assistant
text_sensor:
  - platform: homeassistant
    name: "Display Message"
    id: display_message
    entity_id: input_text.geekmagic_display_message
    on_value:
      then:
        - component.update: lcd_display
  # Forecast entities from Home Assistant (set the entity_ids to match your sensors)
  - platform: homeassistant
    id: forecast_high
    entity_id: sensor.pirate_weather_today_s_high
    on_value:
      then:
        - lambda: |-
            // Rebuild the forecast string when any piece changes
            std::string high = id(forecast_high).has_state() ? id(forecast_high).state.c_str() : "?";
            std::string low  = id(forecast_low).has_state() ? id(forecast_low).state.c_str()  : "?";
            std::string cond = id(forecast_tomorrow_condition).has_state() ? id(forecast_tomorrow_condition).state.c_str() : "?";
            id(forecast_msg) = "High: " + high + "  Low: " + low + "  Tomorrow: " + cond;
            id(forecast_scroll_x) = 240;
            id(forecast_px_len) = (int) (id(forecast_msg).length() * 8);  // approx 8px per char for small font
            id(lcd_display).update();
  - platform: homeassistant
    id: forecast_low
    entity_id: sensor.pirate_weather_today_s_low
    on_value:
      then:
        - lambda: |-
            std::string high = id(forecast_high).has_state() ? id(forecast_high).state.c_str() : "?";
            std::string low  = id(forecast_low).has_state() ? id(forecast_low).state.c_str()  : "?";
            std::string cond = id(forecast_tomorrow_condition).has_state() ? id(forecast_tomorrow_condition).state.c_str() : "?";
            id(forecast_msg) = "High: " + high + "  Low: " + low + "  Tomorrow: " + cond;
            id(forecast_scroll_x) = 240;
            id(forecast_px_len) = (int) (id(forecast_msg).length() * 8);
            id(lcd_display).update();
  - platform: homeassistant
    id: forecast_tomorrow_condition
    entity_id: sensor.pirate_weather_tomorrow_s_condition
    on_value:
      then:
        - lambda: |-
            std::string high = id(forecast_high).has_state() ? id(forecast_high).state.c_str() : "?";
            std::string low  = id(forecast_low).has_state() ? id(forecast_low).state.c_str()  : "?";
            std::string cond = id(forecast_tomorrow_condition).has_state() ? id(forecast_tomorrow_condition).state.c_str() : "?";
            id(forecast_msg) = "High: " + high + "  Low: " + low + "  Tomorrow: " + cond;
            id(forecast_scroll_x) = 240;
            id(forecast_px_len) = (int) (id(forecast_msg).length() * 8);
            id(lcd_display).update();

sensor:
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.gw1200b_outdoor_temperature
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: feels_like_temperature
    entity_id: sensor.gw1200b_feels_like_temperature
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: wind_speed
    entity_id: sensor.gw1200b_wind_speed
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: wind_gust
    entity_id: sensor.gw1200b_wind_gust
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: humidity
    entity_id: sensor.gw1200b_humidity
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: wind_direction
    entity_id: sensor.gw1200b_wind_direction
    on_value:
      then:
        - component.update: lcd_display
  - platform: homeassistant
    id: office_illuminance
    name: "Office Illuminance"
    entity_id: sensor.everything_presence_one_278be8_illuminance
    on_value:
      then:
        # Update display brightness based on illuminance when in auto mode and automation enabled
        - if:
            condition:
              lambda: |-
                if (std::string("${enable_automation}") == "true") {
                  return id(office_occupancy).state && id(back_light).current_values.is_on() && id(brightness_mode) == 0;
                } else {
                  return id(back_light).current_values.is_on() && id(brightness_mode) == 0;
                }
            then:
              - light.turn_on:
                  id: back_light
                  brightness: !lambda |-
                    float lux = id(office_illuminance).state;
                    if (lux < 200) return 0.20f;        // 20% for < 200 lx
                    else if (lux < 400) return 0.25f;   // 25% for 200-400 lx
                    else if (lux < 600) return 0.30f;   // 30% for 400-600 lx
                    else return 0.40f;                  // 40% for > 600 lx