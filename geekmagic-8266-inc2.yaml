substitutions:
  device_name: geekmagic-esp8266
  friendly_sensor_name: geekmagic_display_07c9f4

esphome:
  name:  ${device_name}
  friendly_name: GeekMagic ESP8266 Inc2

esp8266:
  board: esp12e
  framework:
    version: recommended

external_components:
  - source:
      type: git
      url: https://github.com/rletendu/esphome.git
      ref: st7789_nobuffer_202312
    components: [st7789v]

ota:
  - platform: esphome
    password: ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Geekmagic-Inc2"
    password: "test12345"

api:
  encryption:
    key: !secret api_key

logger:

captive_portal:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 10 Hz
    id: pwm_output

light:
  - platform: monochromatic
    output: pwm_output
    name: "Backlight"

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Orbitron@700"
    id: font_time
    size: 50

time:
  - platform: homeassistant
    id: esptime
    timezone: America/Chicago

sensor:
  # Your existing sensors
  - platform: homeassistant
    entity_id: sensor.moc_l1_l2_l3
    id: Mocl13
    internal: true
    accuracy_decimals: 1
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
 
  - platform: homeassistant
    entity_id: sensor.sonoffbasic_ds_multi_out
    id: tempzew
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - platform: homeassistant
    entity_id: sensor.temp_dom
    id: poktv
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - platform: homeassistant
    entity_id: sensor.temperature_max
    id: maxout
    internal: true
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  # Weather sensors
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.gw1200b_outdoor_temperature
    accuracy_decimals: 1
    
  - platform: homeassistant
    id: feels_like_temperature
    entity_id: sensor.gw1200b_feels_like_temperature
    accuracy_decimals: 1
    
  - platform: homeassistant
    id: humidity
    entity_id: sensor.gw1200b_humidity
    accuracy_decimals: 0

  # NEW: Wind sensors
  - platform: homeassistant
    id: wind_speed
    entity_id: sensor.gw1200b_wind_speed
    accuracy_decimals: 0
    
  - platform: homeassistant
    id: wind_gust
    entity_id: sensor.gw1200b_wind_gust
    accuracy_decimals: 0
    
  - platform: homeassistant
    id: wind_direction
    entity_id: sensor.gw1200b_wind_direction
    accuracy_decimals: 0

text_sensor:    
  - platform: homeassistant
    name: "Energy 0/1"
    entity_id: input_select.energy_0_1
    id: energy

color:
  - id: color_w
    red: 90%
    green: 90%
    blue: 90%
  - id: color_green
    red: 10%
    green: 60%
    blue: 40%
  - id: color_blue
    red: 10%
    green: 40%
    blue: 60%
  - id: color_blue2
    red: 70%
    green: 70%
    blue: 100%

display:
  - platform: st7789v
    model: "Custom"
    spi_id: spihwd
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    dc_pin: GPIO00
    reset_pin: GPIO02
    eightbitcolor: True
    update_interval: 10s
    id: disp
    spi_mode: mode3
    lambda: |-
      // Clear screen first
      it.fill(Color(0, 0, 0));
      
      int center_x = it.get_width() / 2;
      
      // Top: Time display
      if (id(esptime).now().is_valid()) {
        it.strftime(center_x, 5, id(font_time), id(color_blue2), TextAlign::TOP_CENTER, "%H:%M", id(esptime).now());
      } else {
        it.printf(center_x, 60, id(font_medium), id(color_w), TextAlign::CENTER, "No Time");
        return;
      }
      
      // Row 1: Temperature (left) and Feels Like (right)
      int y = 65;
      if (id(outdoor_temperature).has_state() && id(feels_like_temperature).has_state()) {
        // Left: Outdoor temp with thermometer icon
        int left_x = 15;
        it.filled_circle(left_x, y + 6, 3, Color(255,255,255));
        it.line(left_x, y - 4, left_x, y + 4, Color(255,255,255));
        it.rectangle(left_x - 2, y - 8, 4, 10, Color(255,255,255));
        it.printf(left_x + 8, y, id(font_medium), id(color_w), TextAlign::CENTER_LEFT, "%.0f°", id(outdoor_temperature).state);
        
        // Right: Feels like with sun icon
        int right_x = 125;
        it.circle(right_x, y, 3, Color(255,255,255));
        for (int i = 0; i < 8; i++) {
          float a = i * (3.14159/4.0f);
          int x1 = right_x + (int)(4 * cos(a));
          int y1 = y + (int)(4 * sin(a));
          int x2 = right_x + (int)(6 * cos(a));
          int y2 = y + (int)(6 * sin(a));
          it.line(x1, y1, x2, y2, Color(255,255,255));
        }
        it.printf(right_x + 10, y, id(font_medium), id(color_w), TextAlign::CENTER_LEFT, "%.0f°", id(feels_like_temperature).state);
      }
      
      // Row 2: Wind speed and gust with icons
      y = 100;
      if (id(wind_speed).has_state() && id(wind_gust).has_state()) {
        // Wind speed with streamlines icon
        int wx = 15;
        it.line(wx, y - 4, wx + 8, y - 4, Color(255,255,255));
        it.line(wx + 2, y, wx + 10, y, Color(255,255,255));
        it.line(wx, y + 4, wx + 8, y + 4, Color(255,255,255));
        it.printf(wx + 15, y, id(font_medium), id(color_w), TextAlign::CENTER_LEFT, "%.0f", id(wind_speed).state);
        it.printf(wx + 50, y + 2, id(font_small), id(color_w), TextAlign::CENTER_LEFT, "mph");
        
        // Wind gust with flag icon
        int gx = 125;
        it.line(gx, y - 6, gx, y + 6, Color(255,255,255));
        it.line(gx, y - 6, gx + 8, y - 2, Color(255,255,255));
        it.line(gx + 8, y - 2, gx, y + 2, Color(255,255,255));
        it.printf(gx + 12, y, id(font_medium), id(color_w), TextAlign::CENTER_LEFT, "%.0f", id(wind_gust).state);
        it.printf(gx + 47, y + 2, id(font_small), id(color_w), TextAlign::CENTER_LEFT, "mph");
      }
      
      // Row 3: Wind direction compass
      y = 135;
      if (id(wind_direction).has_state()) {
        int compass_x = 200;
        int compass_r = 12;
        it.circle(compass_x, y, compass_r, Color(255,255,255));
        
        // Draw arrow pointing in wind FROM direction
        float dir_deg = id(wind_direction).state;
        float from_ang = (dir_deg - 90.0f) * 3.14159 / 180.0f;
        float flow_ang = (dir_deg + 90.0f) * 3.14159 / 180.0f;
        
        int arrow_x = compass_x + (int)(compass_r * cos(from_ang));
        int arrow_y = y + (int)(compass_r * sin(from_ang));
        int tip_x = arrow_x + (int)(8 * cos(flow_ang));
        int tip_y = arrow_y + (int)(8 * sin(flow_ang));
        int lx = arrow_x + (int)(4 * -sin(flow_ang));
        int ly = arrow_y + (int)(4 * cos(flow_ang));
        int rx = arrow_x - (int)(4 * -sin(flow_ang));
        int ry = arrow_y - (int)(4 * cos(flow_ang));
        it.filled_triangle(tip_x, tip_y, lx, ly, rx, ry, Color(255,255,255));
      }
      
      // Row 4: Humidity bar
      y = 170;
      if (id(humidity).has_state()) {
        // Droplet icon
        int icon_x = 20;
        it.filled_circle(icon_x, y + 2, 5, id(color_blue));
        it.filled_triangle(icon_x, y - 6, icon_x - 4, y + 1, icon_x + 4, y + 1, id(color_blue));
        
        // Humidity bar
        int bar_x = 35;
        int bar_w = 140;
        int bar_h = 8;
        float pct = id(humidity).state / 100.0f;
        it.rectangle(bar_x, y - 2, bar_w, bar_h, Color(255,255,255));
        it.filled_rectangle(bar_x, y - 2, (int)(bar_w * pct), bar_h, id(color_blue));
        
        // Percentage
        it.printf(bar_x + bar_w + 5, y, id(font_medium), id(color_blue), TextAlign::CENTER_LEFT, "%.0f%%", id(humidity).state);
      }
      
      // Bottom: Your existing data (compact)
      y = 205;
      it.printf(10, y, id(font_small), id(color_green), TextAlign::LEFT, "%.1fW %s In:%.1f°C", 
                id(Mocl13).state, id(energy).state.c_str(), id(tempzew).state);
